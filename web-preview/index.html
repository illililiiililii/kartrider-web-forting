<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>카트라이더 5136 · 웹 포트</title>
  <link rel="stylesheet" href="game.css?v=2">
</head>
<body>
  <main class="game-shell">
    <canvas id="world" aria-label="카트라이더 3D 게임"></canvas>
    <section id="lobby" class="lobby">
      <header class="lobby-header"><div class="brand">크레이지레이싱 <strong>카트라이더</strong><small>5136 WEB PORT</small></div><div class="header-actions"><span id="load-status">원본 리소스 로딩 중…</span><a href="debug.html">물리 테스트</a></div></header>
      <div class="lobby-body">
        <div class="lobby-left"><p class="section-kicker">SPEED MODE</p><h1>스피드 개인전</h1><p class="lobby-caption">카트와 캐릭터를 고르고 원본 트랙에서 달려보세요.</p><button id="mode-speed" class="sprite-mode" aria-label="스피드 개인전 선택"></button><div class="selection"><label>카트바디<select id="kart-choice"><option value="whiteKnightV1">백기사 V1</option><option value="saberV1">세이버 V1</option></select></label><label>캐릭터<select id="character-choice"><option value="dao">다오</option><option value="bazzi">배찌</option></select></label><label>트랙<select id="track-choice"><option value="beach_I01">비치 I01</option><option value="beach_I02">비치 I02</option><option value="village_R01">빌리지 R01</option></select></label></div><button id="start" class="start-button" disabled>주행 시작</button></div>
        <aside class="lobby-right"><span class="panel-heading">TRACK SELECT</span><img id="track-card" alt="선택한 원본 트랙 카드"><div class="track-name" id="track-name">비치 I01</div><p>원본 3D 메시 · 실험적 충돌 메시</p><div class="info-card">LOCAL ASSET PREVIEW<small>추출된 5136 리소스는 이 컴퓨터에서만 불러옵니다.</small></div></aside>
      </div>
      <nav class="bottom-menu"><button class="menu-active" data-lobby-action="start">게임 시작</button><button data-lobby-action="kart">카트 선택</button><button data-lobby-action="character">캐릭터 선택</button><button data-lobby-action="track">트랙 선택</button><span class="bottom-note">스피드 개인전 · 로컬 연습</span></nav>
    </section>
    <section id="race-ui" class="race-ui hidden" aria-label="레이스 화면">
      <div class="hud-top-left"><strong>1<span>st</span></strong><div class="nitro-slot">N₂O <span id="nitro-count">0</span></div></div>
      <div class="hud-top-right"><div id="lap">연습 주행</div><strong id="timer">00:00.00</strong><span class="rec">● REC</span></div>
      <div class="countdown" id="countdown"></div>
      <div class="race-actions"><button id="back-lobby">로비</button><button id="reset" title="체크포인트 리셋 (R)">R · 재시작</button></div>
      <div class="map-panel"><img id="minimap" alt="선택한 원본 트랙 미니맵"><span id="map-label">비치 I01</span></div>
      <div class="dash"><div class="tacho"><div id="needle" class="needle"></div><div class="needle-cap"></div><span id="speed">000</span></div><div class="booster"><span>N₂O</span><div class="gauge-rail"><i id="gauge"></i></div></div></div>
      <div class="touch-controls"><button data-control="left">◀</button><button data-control="right">▶</button><button data-control="throttle">가속</button><button data-control="brake">후진</button><button data-control="drift">Shift</button><button data-control="boost">Ctrl</button></div>
    </section>
    <div id="error" class="error hidden" role="alert"></div>
  </main>
  <script type="module" src="game.js?v=3"></script>
</body>
</html>
